<style>
/* Layout: engineering notebook — week rail on the left, a ~68ch reading column, graph-paper ground. */
:root {
  --paper: #f6f7f4;
  --paper-2: #eceee8;
  --card: #ffffff;
  --ink: #17202e;
  --ink-2: #4a5566;
  --ink-3: #7a8494;
  --rule: #d9ddd4;
  --grid: rgba(23, 32, 46, 0.045);
  --accent: #2346c8;
  --accent-ink: #ffffff;
  --accent-soft: #e4e9fb;
  --mark: #ffe39a;
  --ok: #1d7a4a;
  --ok-soft: #dcf1e5;
  --warn: #9a5b00;
  --warn-soft: #fbecd2;
  --bad: #b3261e;
  --bad-soft: #f9dedc;
  --code-bg: #eef0ea;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --step--1: 0.85rem;
  --step-0: 1.02rem;
  --step-1: 1.22rem;
  --step-2: 1.55rem;
  --step-3: 2.1rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141c; --paper-2: #161d28; --card: #151c27; --ink: #dfe5ee; --ink-2: #aab4c3; --ink-3: #7c8799;
    --rule: #263142; --grid: rgba(223, 229, 238, 0.035); --accent: #8aa6ff; --accent-ink: #0f141c; --accent-soft: #1d2945;
    --mark: #5b4a17; --ok: #6fd39b; --ok-soft: #173325; --warn: #f0b458; --warn-soft: #3a2a10; --bad: #ff8a80;
    --bad-soft: #3d1d1b; --code-bg: #111821; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141c; --paper-2: #161d28; --card: #151c27; --ink: #dfe5ee; --ink-2: #aab4c3; --ink-3: #7c8799;
  --rule: #263142; --grid: rgba(223, 229, 238, 0.035); --accent: #8aa6ff; --accent-ink: #0f141c; --accent-soft: #1d2945;
  --mark: #5b4a17; --ok: #6fd39b; --ok-soft: #173325; --warn: #f0b458; --warn-soft: #3a2a10; --bad: #ff8a80;
  --bad-soft: #3d1d1b; --code-bg: #111821; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: var(--step-2); font-weight: 700; }
h3 { font-size: var(--step-1); font-weight: 700; }
code, pre, kbd { font-family: var(--font-mono); font-size: 0.86em; }
code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: var(--radius); padding: 0.9rem 1rem; overflow-x: auto; line-height: 1.45; }
pre code { background: none; padding: 0; }
pre.mermaid { background: var(--card); text-align: center; }
mark { background: var(--mark); color: inherit; padding: 0 0.15em; }
.label { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
button, .btn {
  font-family: var(--font-display); font-weight: 700; font-size: 0.92rem; cursor: pointer;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: var(--radius);
  padding: 0.45rem 0.8rem; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none;
}
button:hover, .btn:hover { border-color: var(--ink-3); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
button:disabled { opacity: 0.55; cursor: default; }
input[type="text"], input[type="date"], textarea, select {
  font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 0.5rem 0.6rem; width: 100%;
}
textarea { min-height: 7rem; resize: vertical; font-size: 0.95rem; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); min-height: 100%; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule);
  background: var(--paper-2); padding: 1.1rem 1rem 2rem; display: flex; flex-direction: column; gap: 1rem;
}
.brand { display: flex; flex-direction: column; gap: 0.15rem; }
.brand b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
.brand span { font-size: 0.85rem; color: var(--ink-2); }
.nav { display: flex; flex-direction: column; gap: 0.15rem; }
.nav a {
  display: grid; grid-template-columns: 2.1rem 1fr auto; align-items: center; gap: 0.5rem; padding: 0.4rem 0.45rem;
  border-radius: var(--radius); text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 500; font-size: 0.93rem;
}
.nav a:hover { background: var(--card); }
.nav a[aria-current="page"] { background: var(--card); box-shadow: inset 3px 0 0 var(--accent); }
.nav .wk { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-3); }
.nav .pct { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav .pct.done { color: var(--ok); }
.nav-sep { height: 1px; background: var(--rule); margin: 0.4rem 0; }
.sync { font-size: 0.78rem; color: var(--ink-3); font-family: var(--font-mono); }
.theme-toggle { align-self: flex-start; font-size: 0.8rem; padding: 0.3rem 0.6rem; }
.menu-btn { display: none; }
main { min-width: 0; padding-block: 2rem 5rem; padding-inline: clamp(16px, 4vw, 3.5rem); }
.page { max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.6rem; }
.read { max-width: 44rem; }

/* ---------- blocks ---------- */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1.1rem 1.2rem; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.9rem; }
.stack { display: flex; flex-direction: column; gap: 0.7rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.pill { font-family: var(--font-mono); font-size: 0.72rem; padding: 0.12rem 0.5rem; border-radius: 99px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.bar { height: 6px; background: var(--paper-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.hero { display: flex; flex-direction: column; gap: 0.6rem; }
.hero p { max-width: 42rem; margin: 0; color: var(--ink-2); font-size: var(--step-1); line-height: 1.45; }

.week-card { display: flex; flex-direction: column; gap: 0.55rem; text-decoration: none; color: inherit; }
.week-card:hover { border-color: var(--ink-3); }
.week-card h3 { font-size: 1.08rem; }
.week-card p { margin: 0; font-size: 0.92rem; color: var(--ink-2); }
.week-card .num { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-3); }
.week-card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

table.plan { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
table.plan th, table.plan td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.plan th { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 400; }
.table-wrap { overflow-x: auto; }

.lesson-list { display: flex; flex-direction: column; }
.lesson-link { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 0.7rem; align-items: baseline; padding: 0.7rem 0.2rem; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
.lesson-link:hover strong { color: var(--accent); }
.lesson-link .tick { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 1.5px solid var(--ink-3); display: inline-block; position: relative; top: 0.15rem; }
.lesson-link .tick.on { background: var(--ok); border-color: var(--ok); }
.lesson-link strong { font-family: var(--font-display); font-weight: 700; }
.lesson-link p { margin: 0.15rem 0 0; font-size: 0.9rem; color: var(--ink-2); }

/* ---------- lesson ---------- */
.lesson-layout { display: grid; grid-template-columns: minmax(0, 44rem) minmax(0, 15rem); gap: 2.5rem; align-items: start; }
.prose { min-width: 0; }
.prose > * + * { margin-top: 1rem; }
.prose h2 { margin-top: 2.2rem; padding-top: 0.6rem; border-top: 1px solid var(--rule); }
.prose h3 { margin-top: 1.6rem; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 1.3rem; }
.prose li + li { margin-top: 0.3rem; }
.prose blockquote { margin: 0; padding: 0.7rem 1rem; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--radius) var(--radius) 0; }
.prose .callout { padding: 0.8rem 1rem; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); }
.prose .callout.pitfall { border-color: var(--warn); background: var(--warn-soft); }
.prose .callout.prod { border-color: var(--ok); background: var(--ok-soft); }
.prose .callout > b:first-child { font-family: var(--font-display); display: block; margin-bottom: 0.25rem; }
.prose table { border-collapse: collapse; font-size: 0.92rem; }
.prose table th, .prose table td { border-bottom: 1px solid var(--rule); padding: 0.4rem 0.6rem; text-align: left; }
.prose mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 0.3rem 0; }
.margin { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1.5rem); display: flex; flex-direction: column; gap: 1rem; font-size: 0.9rem; }
.margin ul { margin: 0; padding-left: 1.1rem; }
.margin li + li { margin-top: 0.35rem; }
.lesson-head { display: flex; flex-direction: column; gap: 0.5rem; }
.crumbs { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-3); display: flex; gap: 0.4rem; flex-wrap: wrap; }
.crumbs a { color: var(--ink-3); }

.widget { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); padding: 0.9rem; display: flex; flex-direction: column; gap: 0.6rem; }
.widget canvas { width: 100%; max-width: 100%; height: auto; border-radius: 4px; background: var(--paper); touch-action: none; }
.widget .controls { display: flex; flex-wrap: wrap; gap: 0.6rem 1.2rem; align-items: center; font-size: 0.85rem; font-family: var(--font-mono); }
.widget .controls label { display: flex; align-items: center; gap: 0.45rem; }
.widget .controls input[type="range"] { width: 8rem; accent-color: var(--accent); }
.widget .readout { font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.widget-title { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; }

.quiz { display: flex; flex-direction: column; gap: 1.1rem; }
.q { display: flex; flex-direction: column; gap: 0.45rem; }
.q .stem { font-weight: 600; }
.q .opts { display: flex; flex-direction: column; gap: 0.35rem; }
.q .opt { text-align: left; font-family: var(--font-body); font-weight: 400; font-size: 0.95rem; justify-content: flex-start; line-height: 1.4; }
.q .opt.right { background: var(--ok-soft); border-color: var(--ok); }
.q .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.q .why { font-size: 0.92rem; padding: 0.55rem 0.8rem; border-left: 3px solid var(--ok); background: var(--ok-soft); border-radius: 0 var(--radius) var(--radius) 0; }
.q .why.miss { border-left-color: var(--bad); background: var(--bad-soft); }

.tutor-out { white-space: pre-wrap; font-size: 0.95rem; background: var(--paper-2); border-radius: var(--radius); padding: 0.8rem 1rem; }
.hint { border: 1px dashed var(--rule); border-radius: var(--radius); padding: 0.6rem 0.8rem; }
.hint[data-open="1"] { border-style: solid; background: var(--paper-2); }
.milestone { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.8rem; align-items: start; padding: 1rem 0; border-bottom: 1px solid var(--rule); }
.milestone input[type="checkbox"] { width: 1.15rem; height: 1.15rem; margin-top: 0.3rem; accent-color: var(--ok); }
.cmd { display: flex; gap: 0.5rem; align-items: stretch; }
.cmd code { flex: 1; min-width: 0; display: block; padding: 0.55rem 0.7rem; border: 1px solid var(--rule); overflow-x: auto; white-space: nowrap; }

.flash { min-height: 12rem; display: flex; flex-direction: column; gap: 0.9rem; justify-content: space-between; }
.flash .front { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.flash .back { font-size: 1rem; border-top: 1px solid var(--rule); padding-top: 0.8rem; }
.boxes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.4rem; }
.boxes div { text-align: center; padding: 0.45rem 0.2rem; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); }
.boxes b { display: block; font-family: var(--font-mono); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.boxes span { font-size: 0.72rem; color: var(--ink-3); font-family: var(--font-mono); }

@media (max-width: 1100px) {
  .lesson-layout { grid-template-columns: minmax(0, 1fr); }
  .margin { position: static; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(19rem, 86vw); z-index: 20; transform: translateX(-105%); transition: transform 0.2s ease; box-shadow: 0 0 40px rgba(0,0,0,0.25); padding-top: calc(env(safe-area-inset-top, 0px) + 1rem); }
  .rail.open { transform: none; }
  .menu-btn { display: inline-flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; margin: 0.6rem 0 0 16px; }
  main { padding-block: 1rem 4rem; }
  h1 { font-size: 1.75rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

window.R = String.raw;

<script>
(() => {
  "use strict";
  const W = window.COURSE.weeks.sort((a, b) => a.n - b.n);
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const lessonById = {}, weekOfLesson = {};
  W.forEach(w => w.lessons.forEach((l, i) => { lessonById[l.id] = l; weekOfLesson[l.id] = w; l.idx = i + 1; }));
  const allCards = W.flatMap(w => w.lessons.flatMap(l => (l.cards || []).map((c, i) => ({ ...c, id: `${l.id}c${i}`, lesson: l.id, week: w.n }))));

  // ------------------------------------------------------------------ state + persistence
  const LS_KEY = "forge-course-progress-v1";
  const empty = () => ({ v: 1, start: "2026-10-05", done: {}, quiz: {}, notes: {}, ms: {}, hints: {}, cards: {}, log: {} });
  let S = empty();
  try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(empty(), JSON.parse(raw)); } catch (e) {}
  let dbRef = null, writing = false, dirty = false, timer = null, lastRemote = "";
  const syncEl = $("#sync");
  const today = () => new Date().toISOString().slice(0, 10);
  function save(logActivity = true) {
    if (logActivity) S.log[today()] = (S.log[today()] || 0) + 1;
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
    if (!dbRef) return;
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(flush, 900);
  }
  async function flush() {
    if (!dbRef || writing || !dirty) return;
    writing = true; dirty = false;
    const body = JSON.parse(JSON.stringify(S));
    lastRemote = JSON.stringify(body);
    try { await dbRef.set(body); syncEl.textContent = "Progress: synced to your account"; }
    catch (e) {
      if (e && e.code === "invalid_argument") { dbRef = null; syncEl.textContent = "Progress: saving on this device"; }
      else { syncEl.textContent = "Progress: sync paused, saved on this device"; dirty = true; }
    }
    writing = false;
    if (dirty) timer = setTimeout(flush, 900);
  }
  (async () => {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc("data/users/" + id + "/progress");
      const snap = await ref.get();
      if (snap.exists) {
        const remote = snap.data();
        S = mergeState(Object.assign(empty(), remote), S);
      }
      dbRef = ref;
      syncEl.textContent = "Progress: synced to your account";
      save(false);
      route();
    } catch (e) { /* stay on local storage */ }
  })();
  function mergeState(a, b) {
    const out = Object.assign(empty(), a);
    for (const k of ["done", "quiz", "notes", "ms", "hints", "cards", "log"]) out[k] = Object.assign({}, a[k] || {}, b[k] || {});
    for (const k of Object.keys(b.log || {})) out.log[k] = Math.max((a.log || {})[k] || 0, b.log[k]);
    out.start = b.start !== empty().start ? b.start : a.start;
    return out;
  }

  // ------------------------------------------------------------------ helpers
  function lessonsDone(w) { return w.lessons.filter(l => S.done[l.id]).length; }
  function msDone(w) { return w.project.milestones.filter(m => S.ms[m.id]).length; }
  function weekPct(w) {
    const total = w.lessons.length + w.project.milestones.length;
    return Math.round(100 * (lessonsDone(w) + msDone(w)) / total);
  }
  function currentWeek() {
    const start = new Date(S.start + "T00:00:00");
    const days = Math.floor((Date.now() - start) / 86400000);
    return Math.min(8, Math.max(1, Math.floor(days / 7) + 1));
  }
  function streak() {
    let n = 0; const d = new Date();
    for (;;) { const k = d.toISOString().slice(0, 10); if (S.log[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
    return n;
  }

  // current view lives in a variable (remembered per device so a reload returns to it).
  let current = (location.hash || "").slice(1);
  if (!current) { try { current = localStorage.getItem("forge-view") || "home"; } catch (e) { current = "home"; } }
  function go(key) {
    current = key;
    try { localStorage.setItem("forge-view", key); } catch (e) {}
    route();
    window.scrollTo(0, 0);
    $("#main").focus({ preventScroll: true });
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    closeRail();
    go(a.getAttribute("href").slice(1) || "home");
  });
  function route() {
    const key = current || "home";
    const main = $("#main");
    let view, active = key;
    const wm = key.match(/^w(\d)$/), pm = key.match(/^w(\d)-project$/);
    if (key === "review") view = viewReview();
    else if (wm && W[+wm[1] - 1]) view = viewWeek(W[+wm[1] - 1]);
    else if (pm && W[+pm[1] - 1]) { view = viewProject(W[+pm[1] - 1]); active = "w" + pm[1]; }
    else if (lessonById[key]) { view = viewLesson(lessonById[key]); active = "w" + weekOfLesson[key].n; }
    else { view = viewHome(); active = "home"; }
    renderNav(active);
    main.replaceChildren(view);
  }
  window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (k) go(k); });
  route();
})();
</script>
