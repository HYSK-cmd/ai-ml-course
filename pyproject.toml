[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ml"
version = "0.1.0"
description = "Hoon's from-scratch ML stack: autograd -> ML -> NN -> GPT -> serving -> systems -> recsys"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "scikit-learn>=1.4", "scipy>=1.11", "pandas>=2", "mypy>=1.10", "ruff>=0.5"]
w4 = ["torch>=2.4"]
w6 = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "mlflow>=2.12"]
ops = ["dvc>=3", "locust>=2.24"]

[tool.setuptools.packages.find]
include = ["forge*", "pyeng*", "serve*", "sysdesign*", "recsys*"]

# Week 5: you will add [project.scripts], [tool.mypy] and [tool.ruff] sections here.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not slow and not stretch\""
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "slow: long-running training/accuracy tests (run with: pytest -m slow)",
    "stretch: stretch-goal tests (run with: pytest -m stretch)",
]
